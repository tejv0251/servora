<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b675f" />
    <title>Offline — Servora</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7f4;color:#17221f;font:15px/1.55 system-ui,sans-serif;padding:24px}.card{max-width:430px;border:1px solid #e3ded6;border-radius:14px;background:white;padding:28px;box-shadow:0 18px 50px #17221f12}.brand{color:#0b675f;font-weight:750;letter-spacing:-.03em}.mark{display:inline-grid;width:34px;height:34px;place-items:center;border:2px solid #0b675f;border-radius:10px 5px;margin-right:9px}h1{font:500 32px/1.1 Georgia,serif;margin:28px 0 10px}p{color:#66716c}button{min-height:44px;border:0;border-radius:9px;background:#0b675f;color:white;padding:0 18px;font:600 14px system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="mark">S</span>servora field</div>
      <h1>You’re offline</h1>
      <p>Reconnect to reopen your assignment list. Updates already queued on this device will remain available and sync after sign-in.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
